  <circle cx="40" cy="40" r="38" fill="url(#cg)" filter="url(#sh)"/>
  <circle cx="40" cy="40" r="34"   fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.9"/>
  <circle cx="40" cy="40" r="30.5" fill="none" stroke="rgba(255,255,255,0.2)"  stroke-width="0.5"/>
  <text x="40" y="53"
        font-family="'Great Vibes', 'Palatino Linotype', cursive"
        font-size="36"
        fill="white"
        text-anchor="middle">RL</text>

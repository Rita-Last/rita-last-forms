<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:wght@400;600&amp;display=swap');
    </style>
    <radialGradient id="circleGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#9B2035"/>
      <stop offset="100%" stop-color="#5C0D1A"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9B2035" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#9B2035" stop-opacity="0.7"/>
      <stop offset="70%"  stop-color="#9B2035" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9B2035" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- ── KREIS-BADGE ── -->
  <circle cx="35" cy="35" r="32" fill="url(#circleGrad)" filter="url(#softShadow)"/>
  <!-- Innerer dekorativer Ring -->
  <circle cx="35" cy="35" r="28.5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.8"/>
  <circle cx="35" cy="35" r="26"   fill="none" stroke="rgba(255,255,255,0.2)"  stroke-width="0.4"/>

  <!-- RL Monogramm (Great Vibes Script) -->
  <text x="35" y="46"
        font-family="'Great Vibes', 'Palatino Linotype', cursive"
        font-size="30"
        fill="white"
        text-anchor="middle"
        opacity="0.97">RL</text>

  <!-- ── TEXT RECHTS ── -->
  <!-- "Rita Last" in Script -->
  <text x="92" y="38"
        font-family="'Great Vibes', 'Palatino Linotype', cursive"
        font-size="32"
        fill="#7A1828"
        letter-spacing="1">Rita Last</text>

  <!-- Dünne Trennlinie -->
  <rect x="92" y="44" width="270" height="0.8" fill="url(#lineGrad)" rx="0.4"/>

  <!-- "INSURANCE · MALLORCA" -->
  <text x="92" y="58"
        font-family="'Cormorant Garamond', 'Georgia', serif"
        font-size="11"
        font-weight="600"
        letter-spacing="3.5"
        fill="#8a8a9a">INSURANCE · MALLORCA</text>
</svg>
